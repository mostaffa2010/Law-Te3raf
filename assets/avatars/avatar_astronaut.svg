<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg_astro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="visor_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg_astro)" stroke="#38bdf8" stroke-width="2"/>
  <!-- Stars -->
  <circle cx="20" cy="25" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="80" cy="30" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="75" cy="75" r="1" fill="#ffffff" opacity="0.6"/>
  <!-- Helmet Outer -->
  <ellipse cx="50" cy="50" rx="30" ry="32" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <!-- Gold Mirrored Visor with Space Reflection -->
  <ellipse cx="50" cy="50" rx="22" ry="18" fill="url(#visor_grad)" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Visor Highlight -->
  <ellipse cx="44" cy="44" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 44 44)"/>
  <!-- Helmet Base -->
  <rect x="36" y="76" width="28" height="8" rx="4" fill="#64748b"/>
</svg>